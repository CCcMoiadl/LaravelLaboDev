name: CI Laravel

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Composer Install
        run: composer install

      - name: Audit des dépendances
        run: composer audit

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dÃ©pendances
        run: composer install --no-interaction --prefer-dist

      - name: VÃ©rifier le formatage avec Pint
        run: ./vendor/bin/pint --test

  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dÃ©pendances
        run: composer install --no-interaction --prefer-dist

      - name: Analyse statique PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  tests:
    runs-on: ubuntu-latest
    needs: [ lint, analyse ]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip
          coverage: xdebug

      - name: Installer les dÃ©pendances
        run: composer install --no-interaction --prefer-dist

      - name: PrÃ©parer le .env de test
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Tests avec couverture HTML
        run: php artisan test --coverage-html reports/coverage

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [ tests ]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
    - name: Configurer la clé SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
    - name: Déployer sur le VPS
      run: |
        ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          cd /home/deploy/${{ secrets.EQUIPE_NOM }} &&
          git fetch origin &&
          git reset --hard origin/main &&
          docker compose down &&
          docker compose up -d --build &&
          sleep 5 &&
          docker compose exec -T app composer install --no-interaction --prefer-dist &&
          docker compose exec -T app php artisan migrate --force &&
          docker compose exec -T app php artisan optimize:clear
        "
